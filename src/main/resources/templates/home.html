<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UB Marketplace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
        nav {
            background: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        nav h1 { color: #4f46e5; font-size: 1.25rem; }
        nav div { display: flex; align-items: center; gap: 1rem; }
        nav span { color: #666; font-size: 0.9rem; }
        nav a {
            background: #4f46e5;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
        nav button {
            background: none;
            border: 1px solid #ddd;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #666;
        }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .filters input {
            flex: 1;
            padding: 0.65rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            min-width: 200px;
        }
        .filters input:focus { border-color: #4f46e5; }
        .filters select {
            padding: 0.65rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            background: white;
            cursor: pointer;
        }
        .filters button {
            padding: 0.65rem 1.25rem;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }
        .card h3 { font-size: 1rem; color: #1a1a2e; margin-bottom: 0.5rem; }
        .card p { font-size: 0.85rem; color: #666; margin-bottom: 0.75rem; }
        .card .price { font-size: 1.1rem; font-weight: 700; color: #4f46e5; }
        .card .meta { font-size: 0.75rem; color: #999; margin-top: 0.5rem; }
        .badge {
            display: inline-block;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 20px;
            margin-bottom: 0.5rem;
        }
        .empty {
            text-align: center;
            color: #999;
            padding: 4rem;
            grid-column: 1/-1;
        }
        .empty h2 { margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <nav>
        <h1>UB Marketplace</h1>
        <div>
            <span id="welcomeMsg"></span>
            <a href="/post">+ Post Item</a>
            <button onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="filters">
            <input type="text" id="searchInput" placeholder="Search listings..." />
            <select id="categorySelect">
                <option value="">All Categories</option>
                <option value="Books">Books</option>
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <option value="Furniture">Furniture</option>
                <option value="Other">Other</option>
            </select>
            <button onclick="loadListings()">Search</button>
        </div>
        <div class="grid" id="listings"></div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const fullName = localStorage.getItem('fullName');
        if (!token) window.location.href = '/login';
        document.getElementById('welcomeMsg').textContent = 'Hi, ' + fullName;

        async function loadListings() {
            const search = document.getElementById('searchInput').value;
            const category = document.getElementById('categorySelect').value;

            let url = '/api/listings?';
            if (search) url += `search=${encodeURIComponent(search)}&`;
            if (category) url += `category=${encodeURIComponent(category)}`;

            const response = await fetch(url, {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            const listings = await response.json();
            const grid = document.getElementById('listings');

            if (listings.length === 0) {
                grid.innerHTML = `
                    <div class="empty">
                        <h2>No listings found</h2>
                        <p>Try a different search or be the first to post!</p>
                    </div>`;
                return;
            }

            grid.innerHTML = listings.map(l => `
                <div class="card">
                    ${l.category ? `<span class="badge">${l.category.name}</span>` : ''}
                    <h3>${l.title}</h3>
                    <p>${l.description || 'No description'}</p>
                    <div class="price">P ${l.price}</div>
                    <div class="meta">Posted by ${l.user.fullName}</div>
                </div>
            `).join('');
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }

        document.getElementById('searchInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') loadListings();
        });

        loadListings();
    </script>
</body>
</html>
