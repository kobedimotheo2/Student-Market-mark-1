<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UB Marketplace — Post Item</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }

        nav {
            background: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        nav h1 { color: #4f46e5; font-size: 1.25rem; }
        nav a { color: #4f46e5; text-decoration: none; font-size: 0.9rem; }

        .container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }

        h2 { margin-bottom: 1.5rem; color: #1a1a2e; }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.25rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            outline: none;
            font-family: inherit;
            transition: border 0.2s;
        }

        input:focus, textarea:focus, select:focus { border-color: #4f46e5; }

        textarea { height: 100px; resize: vertical; }

        button {
            width: 100%;
            padding: 0.75rem;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #4338ca; }

        .success {
            color: #16a34a;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .error {
            color: #dc2626;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <nav>
        <h1>UB Marketplace</h1>
        <a href="/home">← Back to listings</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Post an Item</h2>

            <p class="success" id="success">Item posted successfully!</p>
            <p class="error" id="error"></p>

            <label>Title</label>
            <input type="text" id="title" placeholder="e.g. Calculus Textbook" />

            <label>Description</label>
            <textarea id="description" placeholder="Describe your item..."></textarea>

            <label>Price (Pula)</label>
            <input type="number" id="price" placeholder="e.g. 150" />

            <button onclick="postItem()">Post Item</button>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login';

        async function postItem() {
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const price = document.getElementById('price').value;
            const error = document.getElementById('error');
            const success = document.getElementById('success');

            const response = await fetch('/api/listings', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ title, description, price })
            });

            if (response.ok) {
                success.style.display = 'block';
                error.style.display = 'none';
                document.getElementById('title').value = '';
                document.getElementById('description').value = '';
                document.getElementById('price').value = '';
            } else {
                error.style.display = 'block';
                error.textContent = 'Failed to post item. Please try again.';
            }
        }
    </script>
</body>
</html>
