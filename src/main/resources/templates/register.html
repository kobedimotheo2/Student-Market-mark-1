<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UB Marketplace — Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --sand: #F5EFE0; --clay: #C4622D; --clay-dark: #A34E22;
            --bark: #2C1A0E; --moss: #4A5E3A; --cream: #FDFAF4;
            --stone: #8C7B6B; --warm-border: #E0D4BC;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--sand); min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
        .panel-left { background: var(--moss); display: flex; flex-direction: column; justify-content: space-between; padding: 3rem; position: relative; overflow: hidden; }
        .panel-left::before { content: ''; position: absolute; width: 350px; height: 350px; border-radius: 50%; background: #2C3D20; opacity: 0.4; top: -80px; right: -80px; }
        .panel-left::after { content: ''; position: absolute; width: 250px; height: 250px; border-radius: 50%; background: var(--clay); opacity: 0.12; bottom: 40px; left: -60px; }
        .brand { position: relative; z-index: 1; }
        .brand-icon { width: 52px; height: 52px; background: rgba(255,255,255,0.15); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; font-size: 1.5rem; }
        .brand h1 { font-family: 'Fraunces', serif; font-size: 2.2rem; color: var(--cream); line-height: 1.1; margin-bottom: 1rem; }
        .brand h1 em { font-style: italic; color: #a8d5a2; }
        .brand p { color: rgba(255,255,255,0.65); font-size: 0.95rem; line-height: 1.6; max-width: 280px; }
        .steps { position: relative; z-index: 1; }
        .steps p { color: rgba(255,255,255,0.5); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 1rem; }
        .step { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
        .step-dot { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: white; font-weight: 600; flex-shrink: 0; }
        .step span { color: rgba(255,255,255,0.8); font-size: 0.875rem; }
        .panel-right { display: flex; align-items: center; justify-content: center; padding: 2.5rem 2rem; overflow-y: auto; }
        .form-box { width: 100%; max-width: 380px; }
        .form-header { margin-bottom: 1.75rem; }
        .form-header h2 { font-family: 'Fraunces', serif; font-size: 1.9rem; color: var(--bark); margin-bottom: 0.4rem; }
        .form-header p { color: var(--stone); font-size: 0.9rem; }
        .field { margin-bottom: 1rem; }
        label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--bark); margin-bottom: 0.4rem; letter-spacing: 0.05em; text-transform: uppercase; }
        input { width: 100%; padding: 0.85rem 1rem; border: 1.5px solid var(--warm-border); border-radius: 10px; font-size: 0.95rem; font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--bark); outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
        input:focus { border-color: var(--moss); box-shadow: 0 0 0 3px rgba(74,94,58,0.12); }
        input::placeholder { color: #b8a898; }
        .btn { width: 100%; padding: 0.9rem; background: var(--moss); color: white; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: background 0.2s, transform 0.1s; margin-top: 0.5rem; }
        .btn:hover { background: #3a4d2c; }
        .btn:active { transform: scale(0.99); }
        .error-msg { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; font-size: 0.85rem; padding: 0.65rem 1rem; border-radius: 8px; margin-bottom: 1rem; display: none; }
        .form-footer { text-align: center; margin-top: 1.25rem; font-size: 0.875rem; color: var(--stone); }
        .form-footer a { color: var(--clay); text-decoration: none; font-weight: 600; }
        .form-footer a:hover { text-decoration: underline; }
        @media (max-width: 700px) { body { grid-template-columns: 1fr; } .panel-left { display: none; } }
    </style>
</head>
<body>
    <div class="panel-left">
        <div class="brand">
            <div class="brand-icon">🛍️</div>
            <h1>Join <em>UB</em> Marketplace</h1>
            <p>Connect with thousands of students. Turn your unused stuff into cash.</p>
        </div>
        <div class="steps">
            <p>How it works</p>
            <div class="step"><div class="step-dot">1</div><span>Create your free account</span></div>
            <div class="step"><div class="step-dot">2</div><span>Post items you want to sell</span></div>
            <div class="step"><div class="step-dot">3</div><span>Connect with buyers on campus</span></div>
        </div>
    </div>
    <div class="panel-right">
        <div class="form-box">
            <div class="form-header">
                <h2>Create account</h2>
                <p>Join the UB student community marketplace</p>
            </div>
            <div class="error-msg" id="error"></div>
            <div class="field">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Your full name" />
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@ub.ac.bw" />
            </div>
            <div class="field">
                <label>Phone</label>
                <input type="text" id="phone" placeholder="71234567" />
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="password" placeholder="Choose a strong password" />
            </div>
            <button class="btn" onclick="register()">Create Account</button>
            <div class="form-footer">
                Already have an account? <a href="/login">Sign in</a>
            </div>
        </div>
    </div>
    <script>
        async function register() {
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const error = document.getElementById('error');
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullName, email, phone, password })
            });
            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('fullName', data.fullName);
                window.location.href = '/home';
            } else {
                const msg = await response.text();
                error.style.display = 'block';
                error.textContent = msg || 'Registration failed. Please try again.';
            }
        }
    </script>
</body>
</html>
