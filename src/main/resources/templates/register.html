<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UB Marketplace — Register</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 { font-size: 1.5rem; margin-bottom: 0.25rem; color: #1a1a2e; }

        p.subtitle { color: #666; margin-bottom: 1.5rem; font-size: 0.9rem; }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.25rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            outline: none;
            transition: border 0.2s;
        }

        input:focus { border-color: #4f46e5; }

        button {
            width: 100%;
            padding: 0.75rem;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #4338ca; }

        .error {
            color: #dc2626;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #666;
        }

        .footer a { color: #4f46e5; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h1>UB Marketplace</h1>
        <p class="subtitle">Create your account</p>

        <p class="error" id="error"></p>

        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Your full name" />

        <label>Email</label>
        <input type="email" id="email" placeholder="you@ub.ac.bw" />

        <label>Phone</label>
        <input type="text" id="phone" placeholder="71234567" />

        <label>Password</label>
        <input type="password" id="password" placeholder="Choose a password" />

        <button onclick="register()">Create Account</button>

        <div class="footer">
            Already have an account? <a href="/login">Sign in</a>
        </div>
    </div>

    <script>
        async function register() {
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const error = document.getElementById('error');

            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullName, email, phone, password })
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('fullName', data.fullName);
                window.location.href = '/home';
            } else {
                const msg = await response.text();
                error.style.display = 'block';
                error.textContent = msg;
            }
        }
    </script>
</body>
</html>
