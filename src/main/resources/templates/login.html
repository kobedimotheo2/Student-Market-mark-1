<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UB Marketplace — Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --sand: #F5EFE0; --clay: #C4622D; --clay-dark: #A34E22;
            --bark: #2C1A0E; --moss: #4A5E3A; --cream: #FDFAF4;
            --stone: #8C7B6B; --warm-border: #E0D4BC;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--sand); min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
        .panel-left { background: var(--bark); display: flex; flex-direction: column; justify-content: space-between; padding: 3rem; position: relative; overflow: hidden; }
        .panel-left::before { content: ''; position: absolute; width: 400px; height: 400px; border-radius: 50%; background: var(--clay); opacity: 0.15; bottom: -100px; left: -100px; }
        .panel-left::after { content: ''; position: absolute; width: 200px; height: 200px; border-radius: 50%; background: var(--moss); opacity: 0.2; top: 60px; right: -60px; }
        .brand { position: relative; z-index: 1; }
        .brand-icon { width: 52px; height: 52px; background: var(--clay); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; font-size: 1.5rem; }
        .brand h1 { font-family: 'Fraunces', serif; font-size: 2.4rem; color: var(--cream); line-height: 1.1; margin-bottom: 1rem; }
        .brand h1 em { font-style: italic; color: var(--clay); }
        .brand p { color: var(--stone); font-size: 0.95rem; line-height: 1.6; max-width: 280px; }
        .testimonial { position: relative; z-index: 1; border-left: 3px solid var(--clay); padding-left: 1.25rem; }
        .testimonial p { font-family: 'Fraunces', serif; font-style: italic; color: var(--cream); font-size: 1rem; line-height: 1.6; margin-bottom: 0.5rem; }
        .testimonial span { font-size: 0.8rem; color: var(--stone); }
        .panel-right { display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
        .form-box { width: 100%; max-width: 380px; }
        .form-header { margin-bottom: 2rem; }
        .form-header h2 { font-family: 'Fraunces', serif; font-size: 1.9rem; color: var(--bark); margin-bottom: 0.4rem; }
        .form-header p { color: var(--stone); font-size: 0.9rem; }
        .field { margin-bottom: 1.1rem; }
        label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--bark); margin-bottom: 0.4rem; letter-spacing: 0.05em; text-transform: uppercase; }
        input { width: 100%; padding: 0.85rem 1rem; border: 1.5px solid var(--warm-border); border-radius: 10px; font-size: 0.95rem; font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--bark); outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
        input:focus { border-color: var(--clay); box-shadow: 0 0 0 3px rgba(196,98,45,0.12); }
        input::placeholder { color: #b8a898; }
        .btn { width: 100%; padding: 0.9rem; background: var(--clay); color: white; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: background 0.2s, transform 0.1s; margin-top: 0.5rem; }
        .btn:hover { background: var(--clay-dark); }
        .btn:active { transform: scale(0.99); }
        .error-msg { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; font-size: 0.85rem; padding: 0.65rem 1rem; border-radius: 8px; margin-bottom: 1rem; display: none; }
        .form-footer { text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--stone); }
        .form-footer a { color: var(--clay); text-decoration: none; font-weight: 600; }
        .form-footer a:hover { text-decoration: underline; }
        @media (max-width: 700px) { body { grid-template-columns: 1fr; } .panel-left { display: none; } }
    </style>
</head>
<body>
    <div class="panel-left">
        <div class="brand">
            <div class="brand-icon">🛍️</div>
            <h1>UB <em>Market</em>place</h1>
            <p>Buy and sell textbooks, electronics, furniture and more — right here on campus.</p>
        </div>
        <div class="testimonial">
            <p>"Sold my engineering notes in 20 minutes. This thing actually works."</p>
            <span>— 3rd year, Faculty of Engineering</span>
        </div>
    </div>
    <div class="panel-right">
        <div class="form-box">
            <div class="form-header">
                <h2>Welcome back</h2>
                <p>Sign in to browse and post listings</p>
            </div>
            <div class="error-msg" id="error"></div>
            <div class="field">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@ub.ac.bw" />
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="password" placeholder="Your password" />
            </div>
            <button class="btn" onclick="login()">Sign In</button>
            <div class="form-footer">
                Don't have an account? <a href="/register">Create one</a>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const error = document.getElementById('error');
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('fullName', data.fullName);
                window.location.href = '/home';
            } else {
                error.style.display = 'block';
                error.textContent = 'Invalid email or password. Please try again.';
            }
        }
    </script>
</body>
</html>
